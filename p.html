<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A broke page · No Money</title>
<meta name="description" content="Help someone become slightly less broke." />
<meta property="og:type" content="profile" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>

<div class="page-shell">
  <button class="lang-toggle lang-fixed" id="langToggle" data-i18n="lang.other">中文</button>
  <div class="page-card" id="card"><!-- rendered by JS --></div>

  <div class="page-actions">
    <button class="btn btn-primary" id="shareBtn" data-i18n="p.share_btn">📸 Get share image</button>
    <button class="btn btn-ghost" id="copyBtn" data-i18n="p.copy_btn">🔗 Copy link</button>
  </div>

  <div class="msg-section" id="msgSection"></div>

  <div class="remix-cta">
    <div class="remix-emoji">💸</div>
    <div class="remix-text">
      <strong data-i18n="p.remix_strong">Broke too?</strong>
      <span data-i18n="p.remix_span">Make your own broke page in 60 seconds. No signup.</span>
    </div>
    <a class="btn btn-primary" id="remixBtn" href="create.html" data-i18n="p.remix_btn">Make mine →</a>
  </div>

  <div class="page-foot">
    <a href="create.html" data-i18n-html="p.foot">made with <b>no.money</b></a>
    <!-- anyone can publish here and every button links out to a payment endpoint, so
         visitors need somewhere to point at a page that breaks the content rules.
         href is filled in by p.js with the offending URL prefilled. -->
    <a class="report-link" id="reportLink" rel="nofollow" data-i18n="p.report">Report this page</a>
  </div>
</div>

<!-- share modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 data-i18n="p.modal_h3">Your share image is ready 📸</h3>
    <p data-i18n="p.modal_p">Post it on X, Reddit or Telegram. The image does the begging for you.</p>
    <canvas id="shareCanvas"></canvas>
    <div class="share-row" id="shareRow"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="downloadBtn" data-i18n="p.modal_download">⬇ Download image</button>
      <button class="btn btn-ghost" id="closeModal" data-i18n="p.modal_close">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/src/p.js"></script>
</body>
</html>
