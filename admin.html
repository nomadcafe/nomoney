<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Wall admin · No Money</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="admin-wrap">
  <a class="logo" href="index.html" style="text-decoration:none">no<b>.</b>money</a>
  <h1>Wall admin</h1>

  <div id="tokenBox" class="admin-card" style="display:none">
    <label for="adminToken">Admin token</label>
    <div class="admin-row">
      <input type="password" id="adminToken" placeholder="WALL_ADMIN_TOKEN" autocomplete="off" />
      <button class="btn btn-primary" id="unlock">Unlock</button>
    </div>
    <p class="admin-hint">Stored only in this browser. Same value as the <code>WALL_ADMIN_TOKEN</code> env var.</p>
  </div>

  <div id="adminBody" style="display:none">
    <div class="admin-head">
      <h2>On the wall <span id="wallCount" class="admin-muted"></span></h2>
      <button class="btn btn-ghost btn-sm" id="logout">Forget token</button>
    </div>
    <div id="featuredList" class="admin-list"></div>
    <div class="admin-row" style="margin-top:10px">
      <input type="text" id="addSlug" placeholder="add any page by slug (e.g. one)" autocomplete="off" />
      <button class="btn btn-ghost" id="addSlugBtn">Add</button>
    </div>

    <h2 style="margin-top:28px">Recent pages</h2>
    <div id="recentList" class="admin-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/src/admin.js"></script>
</body>
</html>
